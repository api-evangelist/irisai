aid: irisai
name: Iris.ai
description: >-
  Iris.ai is a Norwegian AI company providing an AI knowledge foundation for
  regulated enterprises, turning complex enterprise and scientific data into
  trustworthy, compliant AI. Its platform spans three products — Axion (data
  organization for AI-ready intelligence), Neuralith (enterprise knowledge
  integration into AI engines), and RSpace, the Researcher Workspace that lets
  R&D teams, librarians, and academics search, filter, analyze, extract,
  summarize, and report across scientific literature. Iris.ai is backed by 500
  Global. The company does not currently publish a public developer API, SDKs,
  or a developer portal; this profile captures its public identity and
  domain-security posture pending any future developer surface.
